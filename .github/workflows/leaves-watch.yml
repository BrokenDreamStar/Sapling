name: Leaves upstream watch

# 只监控两个仓库：
#   - LeavesMC/Leaves       官方仓库（已停更，重点看是否复活/出现 26.x）
#   - HyacinthHaru/Leaves   26.x 移植跟踪 fork
# 不监控其它社区分支。只创建/更新 issue，不修改代码、不推送分支。
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Refresh the tracking issue even if nothing changed
        type: boolean
        default: false

concurrency:
  group: leaves-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    if: github.repository == 'BrokenDreamStar/Sapling'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Watch LeavesMC/Leaves and HyacinthHaru/Leaves
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_REPO: "${{ github.repository }}"
          FORCE: "${{ inputs.force && '1' || '0' }}"
        run: ./scripts/leaves-watch.sh
